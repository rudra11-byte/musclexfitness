workflows:
  ios-build:
    name: MuscleXFitness iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create iOS project
        script: |
          npx cap add ios

      - name: Sync web app
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
